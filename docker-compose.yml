services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aso
      POSTGRES_PASSWORD: aso
      POSTGRES_DB: aso
    ports:
      - "5433:5432"
    volumes:
      - aso_pg_data:/var/lib/postgresql/data

  cron:
    build: ./docker/cron
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://host.docker.internal:3000}
      CRON_SECRET: ${CRON_SECRET}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 6 * * *}
    volumes:
      - ./scripts:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  aso_pg_data:
